<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Dado digital 3D para jogos de tabuleiro - d4, d6, d8, d10, d12, d20">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dice">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Dice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8b5cf6',
                        surface: '#1e1b4b'
                    }
                }
            }
        }
    </script>
    <style>
        html, body { 
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        #diceCanvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased">
    <div class="h-full flex flex-col max-w-md mx-auto relative">
        
        <!-- Install Prompt -->
        <div id="installPrompt" class="hidden absolute top-3 left-3 right-3 z-50 animate-fade-in">
            <div class="bg-slate-800/90 backdrop-blur rounded-xl px-4 py-3 flex items-center gap-3 shadow-2xl border border-slate-700/50">
                <svg class="w-8 h-8 text-primary flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
                    <circle cx="16" cy="8" r="1.5" fill="currentColor"/>
                    <circle cx="8" cy="16" r="1.5" fill="currentColor"/>
                    <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
                    <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                </svg>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium leading-tight">Adicionar à tela inicial</p>
                </div>
                <button id="installBtn" class="px-3 py-1.5 bg-primary hover:bg-primary/80 rounded-lg text-xs font-semibold transition-colors">
                    Instalar
                </button>
                <button id="closeInstall" class="p-1.5 -mr-1 text-slate-400 hover:text-white transition-colors" aria-label="Fechar">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- iOS Install Hint -->
        <div id="iosPrompt" class="hidden absolute top-3 left-3 right-3 z-50 animate-fade-in">
            <div class="bg-slate-800/90 backdrop-blur rounded-xl px-4 py-3 flex items-center gap-3 shadow-2xl border border-slate-700/50">
                <svg class="w-8 h-8 text-primary flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
                    <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
                </svg>
                <div class="flex-1 min-w-0">
                    <p class="text-xs text-slate-300">
                        Toque em
                        <svg class="w-4 h-4 inline-block mx-0.5 align-text-bottom" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2l3.5 3.5-1.41 1.41L13 5.83V16h-2V5.83L9.91 6.91 8.5 5.5 12 2zm7 18H5v-2h14v2z"/>
                        </svg>
                        e <span class="font-medium text-white">Adicionar à Tela de Início</span>
                    </p>
                </div>
                <button id="closeIos" class="p-1.5 -mr-1 text-slate-400 hover:text-white transition-colors" aria-label="Fechar">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Header -->
        <header class="flex items-center justify-center gap-2 px-4 pt-6 pb-4">
            <svg class="w-7 h-7 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
                <circle cx="16" cy="8" r="1.5" fill="currentColor"/>
                <circle cx="8" cy="16" r="1.5" fill="currentColor"/>
                <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
                <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
            </svg>
            <h1 class="text-xl font-semibold tracking-tight">Dice</h1>
        </header>

        <!-- Dice Type Selector -->
        <nav class="px-4 pb-4" role="group" aria-label="Tipo de dado">
            <div class="inline-flex w-full bg-slate-900 rounded-xl p-1 border border-slate-800">
                <button class="dice-type active" data-sides="4" aria-pressed="true">
                    <span class="label">D4</span>
                </button>
                <button class="dice-type" data-sides="6" aria-pressed="false">
                    <span class="label">D6</span>
                </button>
                <button class="dice-type" data-sides="8" aria-pressed="false">
                    <span class="label">D8</span>
                </button>
                <button class="dice-type" data-sides="10" aria-pressed="false">
                    <span class="label">D10</span>
                </button>
                <button class="dice-type" data-sides="12" aria-pressed="false">
                    <span class="label">D12</span>
                </button>
                <button class="dice-type" data-sides="20" aria-pressed="false">
                    <span class="label">D20</span>
                </button>
            </div>
        </nav>

        <!-- 3D Dice Area -->
        <main class="flex-1 px-4 pb-4 min-h-0">
            <div id="diceArea" class="h-full flex flex-col items-center justify-center cursor-pointer rounded-2xl bg-gradient-to-b from-slate-900 to-slate-950 border border-slate-800 relative overflow-hidden">
                <canvas id="diceCanvas" class="w-full h-full"></canvas>
                <div id="tapHint" class="absolute bottom-5 left-0 right-0 flex items-center justify-center gap-2 text-slate-500 text-sm pointer-events-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.042 21.672L13.684 16.6m0 0l-2.51 2.225.569-9.47 5.227 7.917-3.286-.672zM12 2.25V4.5m5.834.166l-1.591 1.591M20.25 10.5H18M7.757 14.743l-1.59 1.59M6 10.5H3.75m4.007-4.243l-1.59-1.59"/>
                    </svg>
                    <span>Toque para rolar</span>
                </div>
            </div>
        </main>
    </div>

    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.2s ease-out;
        }
        .dice-type {
            flex: 1;
            padding: 0.625rem 0;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #94a3b8;
            background: transparent;
            border: none;
            border-radius: 0.625rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .dice-type:active {
            transform: scale(0.96);
        }
        .dice-type.active {
            background: #8b5cf6;
            color: white;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        .dice-type .label {
            display: block;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
