<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Dado 3D para jogos de tabuleiro: d6, d8, d10, d12 e d20.">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dice">
    <title>Dice</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/app.css?v=8">
</head>
<body class="bg-slate-950 font-sans text-white antialiased">
    <div class="relative mx-auto flex h-[100dvh] max-w-md flex-col px-4 pb-[max(1rem,env(safe-area-inset-bottom))] pt-[max(0.75rem,env(safe-area-inset-top))]">

        <div id="install-android" class="install-chip absolute inset-x-3 top-3 z-50 hidden">
            <div class="flex items-center gap-3 rounded-2xl border border-slate-700 bg-slate-900/95 px-3 py-2.5 shadow-2xl backdrop-blur">
                <svg class="h-8 w-8 shrink-0 text-violet-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="3"/>
                    <circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/>
                    <circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/>
                </svg>
                <p class="min-w-0 flex-1 text-sm leading-tight">Adicionar à tela inicial</p>
                <button id="install-accept" type="button" class="rounded-lg bg-violet-600 px-3 py-1.5 text-sm font-semibold">Instalar</button>
                <button id="install-close" type="button" class="p-1 text-slate-400" aria-label="Fechar">
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
        </div>

        <div id="install-ios" class="install-chip absolute inset-x-3 top-3 z-50 hidden">
            <div class="flex items-center gap-3 rounded-2xl border border-slate-700 bg-slate-900/95 px-3 py-2.5 shadow-2xl backdrop-blur">
                <svg class="h-8 w-8 shrink-0 text-violet-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v10m0-10l-3.5 3.5M12 3l3.5 3.5M5 21h14v-2H5v2z"/>
                </svg>
                <p class="min-w-0 flex-1 text-xs leading-snug text-slate-300">No Safari, toque em compartilhar e em Adicionar à Tela de Início.</p>
                <button id="ios-close" type="button" class="p-1 text-slate-400" aria-label="Fechar">
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
        </div>

        <header class="flex items-center justify-center gap-2 pb-4 pt-2">
            <svg class="h-6 w-6 text-violet-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/>
                <circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
                <circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none"/>
                <circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/>
            </svg>
            <h1 class="text-lg font-semibold tracking-tight">Dice</h1>
        </header>

        <div class="die-picker mb-3" role="radiogroup" aria-label="Tipo de dado">
            <button type="button" role="radio" class="is-selected" data-sides="6" aria-checked="true">D6</button>
            <button type="button" role="radio" data-sides="8" aria-checked="false">D8</button>
            <button type="button" role="radio" data-sides="10" aria-checked="false">D10</button>
            <button type="button" role="radio" data-sides="12" aria-checked="false">D12</button>
            <button type="button" role="radio" data-sides="20" aria-checked="false">D20</button>
        </div>

        <p id="hint" class="pb-3 text-center text-sm text-slate-400">Toque no dado para rolar</p>

        <button id="stage" type="button" class="stage min-h-0 flex-1" aria-label="Rolar dado">
            <canvas id="canvas"></canvas>
        </button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module" src="js/app.js?v=8"></script>
</body>
</html>
